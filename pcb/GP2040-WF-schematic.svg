<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" width="1220" height="680">
<title>GP2040-WF 原理图</title>
<rect width="1220" height="680" fill="#0f1419"/>
<text x="40" y="48" fill="#f4f0e0" font-size="28" font-family="DejaVu Sans, sans-serif" font-weight="700">GP2040-WF 原理图</text>
<text x="40" y="74" fill="#9aa3ad" font-size="14" font-family="DejaVu Sans, sans-serif">GP2040-WF Pico16 · 与 firmware-bin/GP2040-WF_Pico16.uf2 同一套脚位 · 无 FN 键</text>
<rect x="40" y="100" width="280" height="390" rx="10" fill="#1b2430" stroke="#d8dee6" stroke-width="1.4"/>
<text x="54" y="126" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">U1 RP2040  QFN-56</text>
<text x="54" y="150" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">12 MHz 晶振 · W25Q16 QSPI</text>
<text x="54" y="168" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">设备 USB：脚 47 DP / 46 DM</text>
<text x="54" y="186" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">认证 USB：GP4 D+  GP3 D−</text>
<text x="54" y="204" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">3V3 ← AMS1117 ← VBUS 5V</text>
<text x="54" y="222" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif"></text>
<text x="54" y="240" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP0  UART → 杰里 RX</text>
<text x="54" y="258" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP1  Si24R1 CE</text>
<text x="54" y="276" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP15 Si24R1 MOSI（从 29 挪来）</text>
<text x="54" y="294" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP21 CSN   GP25 SCK</text>
<text x="54" y="312" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP26/27 OLED I2C</text>
<text x="54" y="330" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP28 WS2812 + 电量灯</text>
<text x="54" y="348" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP29 VBAT ADC3 必须分压</text>
<text x="54" y="366" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP5  L2（原 FN 焊盘）</text>
<text x="54" y="384" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">FN 按键已取消</text>
<rect x="380" y="100" width="240" height="170" rx="10" fill="#1d4e89" stroke="#d8dee6" stroke-width="1.4"/>
<text x="394" y="126" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">U4  Si24R1 / nRF24</text>
<text x="394" y="150" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">CE   GP1</text>
<text x="394" y="168" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">CSN  GP21</text>
<text x="394" y="186" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">SCK  GP25</text>
<text x="394" y="204" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">MOSI GP15   手柄发射</text>
<text x="394" y="222" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">MISO 可不接</text>
<text x="394" y="240" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">3V3 / GND   2 Mbps ch80</text>
<rect x="660" y="100" width="240" height="170" rx="10" fill="#9a3412" stroke="#d8dee6" stroke-width="1.4"/>
<text x="674" y="126" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">杰里 AC632N</text>
<text x="674" y="150" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP0 UART0 TX 1 Mbps</text>
<text x="674" y="168" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">→ 芯片 UART RX (PA5)</text>
<text x="674" y="186" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">共地 3.3 V</text>
<text x="674" y="204" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">BT 名 Pro Controller</text>
<text x="674" y="222" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">VID 057E PID 2009</text>
<text x="674" y="240" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">只做 Switch 经典蓝牙</text>
<rect x="940" y="100" width="240" height="170" rx="10" fill="#0f766e" stroke="#d8dee6" stroke-width="1.4"/>
<text x="954" y="126" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">J2 OLED + 灯</text>
<text x="954" y="150" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">SDA GP26  SCL GP27</text>
<text x="954" y="168" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">SSD1306 128×64</text>
<text x="954" y="186" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">WS2812 DIN GP28</text>
<text x="954" y="204" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">按键灯 0–13 + 电量灯 14</text>
<text x="954" y="222" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">绿=正常  红≈3.5 V</text>
<text x="954" y="240" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">插 USB 一定绿</text>
<rect x="380" y="300" width="240" height="200" rx="10" fill="#b45309" stroke="#d8dee6" stroke-width="1.4"/>
<text x="394" y="326" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">J3 电量 ADC</text>
<text x="394" y="350" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">锂电池 4.2 V 禁止直焊 GP29</text>
<text x="394" y="368" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">VBAT — 100k — GP29</text>
<text x="394" y="386" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">GP29 — 100k — GND</text>
<text x="394" y="404" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">BATTERY_ADC_SCALE = 2.0</text>
<text x="394" y="422" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">空 3.3 V · 满 4.2 V</text>
<text x="394" y="440" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">亏电阈值 3.5 V</text>
<text x="394" y="458" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">RP2040 ADC3 = GPIO29</text>
<rect x="660" y="300" width="240" height="200" rx="10" fill="#7b2d8e" stroke="#d8dee6" stroke-width="1.4"/>
<text x="674" y="326" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">USB</text>
<text x="674" y="350" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">JUSB1 设备口 → 电脑/主机</text>
<text x="674" y="368" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">  USB_DP 47  USB_DM 46</text>
<text x="674" y="386" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">  串 27 Ω</text>
<text x="674" y="404" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">JUSB2 认证口 NXP7105</text>
<text x="674" y="422" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">  GP4 D+  GP3 D−</text>
<text x="674" y="440" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">  PIO USB host order=1</text>
<text x="674" y="458" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">PS5 街机类型 7 引导认证</text>
<rect x="940" y="300" width="240" height="200" rx="10" fill="#2d6a4f" stroke="#d8dee6" stroke-width="1.4"/>
<text x="954" y="326" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">按键（对 GND）</text>
<text x="954" y="350" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">方向  GP20/22/23/16</text>
<text x="954" y="368" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">B1–B4 GP18/13/12/9</text>
<text x="954" y="386" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">R1 L1 R2 L2</text>
<text x="954" y="404" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">     GP10/11/14/5</text>
<text x="954" y="422" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">S1 S2 A1 A2 L3 R3</text>
<text x="954" y="440" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">     8 / 17 / 7 / 6 / 2 / 19</text>
<text x="954" y="458" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">TURBO GP24   无 FN</text>
<rect x="40" y="520" width="1140" height="100" rx="10" fill="#1b2430" stroke="#d8dee6" stroke-width="1.4"/>
<text x="54" y="546" fill="#f4f0e0" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="700">接收器（第二块板 42×18 mm，脚位与手柄不同）</text>
<text x="54" y="570" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">RP2040 + Si24R1：CE GP1 · CSN GP21 · SCK GP25 · MOSI GP29 · MISO GP16</text>
<text x="54" y="588" fill="#e8edf2" font-size="13" font-family="DejaVu Sans, sans-serif">接收器 MOSI 仍是 GP29。手柄 MOSI 才是 GP15。USB 枚举 Switch Pro 057E:2009。插 Switch 底座或 Steam，不要插 Xbox / PS。</text>
<path d="M320 185 L380 185" fill="none" stroke="#8ab4ff" stroke-width="2"/>
<path d="M320 220 L380 220" fill="none" stroke="#8ab4ff" stroke-width="2"/>
<path d="M320 160 L660 160" fill="none" stroke="#ffb38a" stroke-width="2"/>
<path d="M320 400 L380 400" fill="none" stroke="#fbbf24" stroke-width="2"/>
<path d="M320 440 L660 400" fill="none" stroke="#d8b4fe" stroke-width="2"/>
<text x="40" y="650" fill="#9aa3ad" font-size="13" font-family="DejaVu Sans, sans-serif">投板：嘉立创 2 层 1.6 mm。QFN-56 按 RP2040 数据手册表 615–621。先 KiCad 铺铜、DRC，再下 Gerber。</text>
</svg>
